name: Publish Packages to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (e.g. 1.0.2). Leave empty to use package.json versions."
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Sync package versions from release tag or input
        run: |
          RAW_VERSION="${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}"
          VERSION="${RAW_VERSION#v}"
          if [ -n "$VERSION" ]; then
            echo "Syncing package versions to $VERSION"
            node -e '
              const fs = require("fs");
              const version = process.argv[1];
              for (const pkgPath of [
                "packages/core/package.json",
                "packages/worker/package.json",
                "packages/react/package.json",
              ]) {
                const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
                pkg.version = version;
                fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
              }
            ' "$VERSION"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Publish packages to npm
        run: pnpm -r --filter './packages/*' publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
